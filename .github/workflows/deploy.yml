name: Inject Config

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Force remove config.js from tracking (ignored by .gitignore)
        run: |
          git rm --cached config.js 2>/dev/null || true
          rm -f config.js
      
      - name: Create config file
        run: |
          cat > config.js << 'EOF'
          window.__APP_CONFIG__ = {
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseKey: '${{ secrets.SUPABASE_ANON_KEY }}',
            buildRun: '${{ github.run_id }}',
            buildDate: '${{ github.event.repository.updated_at }}'
          };
          console.log('✅ Configuración cargada desde build time');
          EOF
          
          echo "✅ config.js creado"
      
      - name: Commit and push config file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f config.js
          git diff --staged --quiet || git commit -m "chore: update config.js [skip ci]"
          git push
