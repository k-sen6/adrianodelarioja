<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Adriano de la Rioja - Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test de Supabase</h1>
    <div id="status">Cargando...</div>
    <div id="products"></div>

    <script>
        // NO usamos 'const supabase' - usamos un nombre diferente
        console.log("1. Script iniciado");
        
        const MY_SUPABASE_URL = '__SUPABASE_URL__';
        const MY_SUPABASE_KEY = '__SUPABASE_ANON_KEY__.VYNLGCZSbPFgC7ED28w_ppNKNYcEaYVLy9GSMB1KMvs';
        
        // ✅ Usamos window.supabase.createClient (NO creamos variable 'supabase')
        const myClient = window.supabase.createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);
        
        document.getElementById('status').innerHTML = 'Conectando a Supabase...';
        
        myClient.from('products').select('*').then(result => {
            console.log("Resultado:", result);
            if (result.error) {
                document.getElementById('status').innerHTML = 'Error: ' + result.error.message;
            } else {
                document.getElementById('status').innerHTML = '✅ Conexión exitosa! ' + result.data.length + ' productos.';
                document.getElementById('products').innerHTML = result.data.map(p => `<p>${p.name} - €${p.price}</p>`).join('');
            }
        }).catch(err => {
            console.error("Error:", err);
            document.getElementById('status').innerHTML = 'Error: ' + err.message;
        });
    </script>
</body>
</html>
